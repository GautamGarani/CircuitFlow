<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../static/circuitflow_logo.png">
<title>CircuitFlow - Overall Report</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

    @keyframes shimmer{
            100%{
            mask-position: left;
        }
    }

    body {
        margin: 0;
        padding: 0;
        background: white; 
        font-family: Arial, sans-serif;
    }

    .header {
        position: sticky;
        display: grid;
        place-items: center;
        text-align: center;
        top: 0;
        padding: 12px 16px; 
        background: #12a1de;
        color: #f5f5f5;
        font: 18px Arial, sans-serif;
        font-weight: bold;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        z-index: 1000;
    }

    .header-content {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .logo {
        height: 90px; 
        width: auto;
    }

    .block-large {
        background: white;
        border-radius: 12px;
        padding: 30px 20px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.18);
        text-align: center;
        max-width: 500px;
        margin: 40px auto;
    }

    .block-large h3 {
        color: #0a75c2;
        margin-bottom: 20px;
        font-size: 20px;
    }

    .block-large p {
        font-size: 16px;
        margin: 10px 0;
    }

    .back-btn {
        margin-top: 20px;
        width: 80%;
        padding: 12px;
        background: #12a1de;
        color: white;
        border-radius: 5px;
        border: none;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        display: block;
        margin-left: auto;
        margin-right: auto;
        transition-duration: 0.5s;
        mask: linear-gradient(-60deg, #000 30%, #0005, #000 70%) right/350% 100%;
        animation: shimmer 2.0s infinite;
    }

    .back-btn:hover {
        background: #0a75c2;
        transform: scale(1.05);
    }

        table {
        background: white;
        width: 100%;
        max-width: 600px;
        border-collapse: collapse;
        margin: 20px 0;
        border-radius: 8px;
        overflow: hidden; 
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        transition: 0.5s;
    }
    
    th, td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background-color: #12a1de; 
        color: white;
        font-weight: bold;
        text-transform: uppercase;
    }

    tr:nth-child(even) {
        background-color: #f9f9f9; 
    }

    tr:hover {
        background-color: #e5f3ff; 
    }


    @media (max-width: 768px) {
        .logo {
            height: 70px;
        }
        .block-large {
            width: 90%;
            padding: 20px;
        }
        h3 {
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<div class="header">
    <div class="header-content">
        <img class="logo" src="../static/circuitflow_logo.png">
        <h2>Overall Report</h2>
    </div>
</div>

<div class="block-large">
<table class="shimmering-table">
    
        <thead>
            <tr>
                <th><center>Total Volume Used Per Day</center></th>
            </tr>
        </thead>
        <tbody>
            {%for datarow in flow_data %}
            <tr>
                <td>{{datarow}}</td>
            </tr>
            {%endfor%}
        </tbody>
    
    </table>
    <p>Average Usage: <strong>{{average}}</strong></p>
    <p>Most common Usage: <strong>{{mode}}</strong></p>
    <p>Median Usage: <strong>{{median}}</strong></p>
    <a href="/" class="back-btn" target="_blank">⬅ Go to Main Dashboard</a>
</div>

</body>
</html>
