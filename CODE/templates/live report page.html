<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CircuitFlow – Live Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        padding: 0;
        background: white;
        font-family: Arial, sans-serif;
    }

    .header {
        position: sticky;
        display: grid;
        place-items: center;
        text-align: center;
        top: 0;
        padding: 12 16;
        background: #12a1de;
        color: black;
        font: 18 Arial, sans-serif;
        font-weight: bold;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        color: #f5f5f5;
        z-index: 1000;
    }

    /* 2-column layout */
    .main-grid {
        display: grid;
        grid-template-columns: 260px auto;
        gap: 20px;
        width: 90%;
        margin: 20px auto;
        height: calc(100vh - 120px);
    }

    /* Left column (two blocks) */
    .left-col {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .block-small {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.15);
        height: 48%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        transition: 0.3s;
    }

    .block-small:hover {
        transform: scale(1.05);
    }

    /* Graph block */
    .block-large {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.18);
        height: 100%;
    }

    .block-small h3, .block-large h3 {
        color: #0a75c2;
        margin-bottom: 10px;
        text-align: center;
        font-size: 18px;
    }

    button{
        margin-top: 15px;
        width: 100%;
        padding: 12px;
        background: #12a1de;
        color: white;
        border-radius: 5px;
        border: none;
        font-size: 16px;
        cursor: pointer;
        font-weight: 80px;
        display: inline-block;
        mask: linear-gradient(-60deg, #000 30%, #0005, #000 70%) right/350% 100%;
        animation: shimmer 2.5s infinite;
    }

    @keyframes shimmer{
        100%{
            mask-position: left;
        }
    }

    canvas {
        width: 100% !important;
        height: 95% !important;
    }

   .header-content {
    	display: flex;
    	align-items: center;
    	gap: 10px;  /* spacing between logo and text */
    }

    .logo {
    height: 90px;   
    width: auto;
    }

     @media (max-width: 768px) {

        .main-grid {
            grid-template-columns: 1fr;   /* ⭐ 1 column instead of 2 ⭐ */
            height: auto;                 /* ⭐ Allow natural height on mobile ⭐ */
            width: 95%;
        }

        .left-col {
            height: auto;
        }

        .block-small {
            height: auto;                 

        .block-large {
            height: 380px;                
        }

        .logo {
            height: 70px;                
        }

        h2 {
            font-size: 20px;             
        }
    }
</style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <img class="logo" src="../static/circuitflow_logo.png">
        <h2>Live Monitoring</h2>       
    </div>
</div>

<div class="main-grid">

    <!-- LEFT COLUMN -->
    <div class="left-col">

        <!-- Block 1: LIVE USAGE -->
        <div class="block-small">
            <h3>🔵 Live Usage</h3>
            <p id="usageValue">Flow Rate: 0.0 L/min</p>
            <p id="totalValue">Total Used: 0.0 L</p>
            <p id="valveStatus">Valve: CLOSED</p>
        </div>

        <!-- Block 2: BACK BUTTON BLOCK -->
        <div class="block-small">
            <h3>⬅ Back to Main Page</h3>
            <a href="/">
                <button>Go Back</button></a>
        </div>

    </div>

    <!-- RIGHT COLUMN (GRAPH) -->
    <div class="block-large">
        <h3>📈 Live Flow Graph</h3>
        <canvas id="flowChart"></canvas>
    </div>

</div>

<script>
    // Chart.js live graph
    const ctx = document.getElementById('flowChart').getContext('2d');
    const flowChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: "Flow (L/min)",
                data: [],
                borderColor: "#0a75c2",
                backgroundColor: "rgba(10,117,194,0.2)",
                borderWidth: 2,
                tension: 0.35,
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { beginAtZero: true }
            }
        }
    });

    // Dummy live data
    let t = 0;
    setInterval(() => {
        let flow = (Math.random() * 8).toFixed(2);

        document.getElementById("usageValue").textContent = "Flow Rate: " + flow + " L/min";
        document.getElementById("totalValue").textContent =
            "Total Used: " + (parseFloat(document.getElementById("totalValue").textContent.split(" ")[2]) + flow/10).toFixed(2) + " L";

        document.getElementById("valveStatus").textContent = flow > 1 ? "Valve: OPEN" : "Valve: CLOSED";

        flowChart.data.labels.push(t++);
        flowChart.data.datasets[0].data.push(flow);
        flowChart.update();

    }, 1000);
</script>

</body>
</html>
