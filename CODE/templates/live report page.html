<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../static/circuitflow_logo.png">
<title>CircuitFlow – Live Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        padding: 0;
        background: white;
        font-family: Arial, sans-serif;
    }

    .header {
        position: sticky;
        display: grid;
        place-items: center;
        text-align: center;
        top: 0;
        padding: 12 16;
        background: #12a1de;
        color: black;
        font: 18 Arial, sans-serif;
        font-weight: bold;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        color: #f5f5f5;
        z-index: 1000;
    }

    
    .main-grid {
        display: grid;
        grid-template-columns: 260px auto;
        gap: 20px;
        width: 90%;
        margin: 20px auto;
        height: calc(100vh - 120px);
    }

    /* Left column (two blocks) */
    .left-col {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .block-small {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.15);
        height: 48%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        transition: 0.3s;
    }

    .block-small:hover {
        transform: scale(1.05);
    }

    button:hover{
        transform: scale(1.2);
    }
    
    .block-large {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.18);
        height: 100%;

    }

    .block-small h3, .block-large h3 {
        color: #0a75c2;
        margin-bottom: 10px;
        text-align: center;
        font-size: 18px;
    }

    button{
        margin-top: 15px;
        width: 50%;
        padding: 12px;
        background: #12a1de;
        color: white;
        border-radius: 5px;
        border: none;
        font-size: 16px;
        cursor: pointer;
        font-weight: 80px;
        display: inline-block;
        mask: linear-gradient(-60deg, #000 30%, #0005, #000 70%) right/350% 100%;
        animation: shimmer 2.5s infinite;
        transition-duration: 0.5s;
    }

    .button1{
        margin-top: 15px;
        width: 50%;
        padding: 12px;
        background: red;
        color: white;
        border-radius: 5px;
        border: none;
        font-size: 16px;
        cursor: pointer;
        font-weight: 80px;
        display: inline-block;
        mask: linear-gradient(-60deg, #000 30%, #0005, #000 70%) right/350% 100%;
        animation: shimmer 2.5s infinite;
        transition-duration: 0.5s;
    }

    @keyframes shimmer{
        100%{
            mask-position: left;
        }
    }

    canvas {
        width: 100% !important;
        height: 85% !important;
        animation: shimmer 2s infinite;
    }

   .header-content {
        display: flex;
        align-items: center;
        gap: 10px;  
    }

    .logo {
    height: 90px;   
    width: auto;
    }

     @media (max-width: 768px) {

        .main-grid {
            grid-template-columns: 1fr;   
            height: auto;                 
            width: 95%;
        }

        .left-col {
            height: auto;
        }

        .block-small {
            height: auto;                 

        .block-large {
            height: 380px;                
        }

        .logo {
            height: 70px;                
        }

        h2 {
            font-size: 20px;             
        }
    }
    }

    .sp1{
        mask: linear-gradient(-60deg, #000 30%, #0005, #000 70%) right/350% 100%;
        animation: shimmer 1.5s infinite;
    }
    
    footer{
    margin-top: -10px;   
    padding: 10px;
    font-size: 20px;
    opacity: 0.7;
    
}
</style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <img class="logo" src="../static/circuitflow_logo.png">
        <h2><span class="sp1">Live Monitoring</span></h2>       
    </div>
</div>

<div class="main-grid">

    
    <div class="left-col">

        
        <div class="block-small">
            <h3>&#128308; <span class="sp1">Live</span> Usage</h3>
            <p id="usageValue">Flow Rate: 0.0 L/min</p>
            <p id="totalValue">Total Used: 0.0 L</p>
            <p id="valveStatus">Valve Last Status: CLOSED</p>
        </div>

        
        <div class="block-small">
            <h3>⬅ Back to Main Page</h3>
            <a href="/">
                <button>Back</button></a>
            <a href="/live">
                <button class="button1">Reload &#10227;</button></a>
        </div>

    </div>

    
    <div class="block-large">
        <h3>📈 <span class="sp1">Live</span> Flow Graph <span class="sp1">(LPM)</span></h3>
        <canvas id="flowChart"></canvas>
    </div>

</div>

<script>
    
    const MAX_DATA_POINTS = 10; 
    
    //CHANGE: Define the update interval to match the server stream speed (0.4s).
    const UPDATE_INTERVAL_SECONDS = 0.4; 
    
    const ctx = document.getElementById('flowChart').getContext('2d');
    const flowChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: "Flow (L/min)",
                data: [],
                
                //CHANGE: Changed border color to match the header color for better aesthetics
                borderColor: "#12a1de",
                
                backgroundColor: "rgba(10,117,194,0.2)",
                borderWidth: 2,
                tension: 0.35,
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                //Made x-axis values visible, time_values
                x: { 
                    display: true,
                    type: 'category', 
                }, 
                y: { 
                    display: true,
                    beginAtZero: true }
            },
            //CHANGE: Faster animation to match the faster stream interval
            animation: false,
    }});

    //Initialise the total usage
    let totalUsed = 0.0;
    const source = new EventSource("/stream"); 

    source.onmessage = function(event) {
        try {
            //parse the JSON file
            const data = JSON.parse(event.data); 
            const newFlow = Number(data.value); 
            const date = new Date(data.timestamp * 1000); 
           
            const timeLabel = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            
            document.getElementById("usageValue").textContent = `Flow Rate: ${newFlow.toFixed(2)} L/min`;
            
            //rectangular integration
            totalUsed += newFlow * (UPDATE_INTERVAL_SECONDS/60); 
            
            document.getElementById("totalValue").textContent = `Total Used (approx): ${totalUsed.toFixed(4)} L`;

            // Comment out valve status if it fails when server STOPS.
            document.getElementById("valveStatus").textContent = newFlow > 0.01 ? "Valve Last Status: OPEN" : "Valve Last Status: CLOSED";

            const chartData = flowChart.data.datasets[0].data;
            const chartLabels = flowChart.data.labels;
            
            // Add new point and label
            chartData.push(newFlow);
            chartLabels.push(timeLabel); // Using time as the label

            // Limit data points for a scrolling effect
            if (chartData.length > MAX_DATA_POINTS) {
                chartData.shift(); 
                chartLabels.shift(); 
            }

            // Redraw the chart
            flowChart.update();

        } catch (e) {
            console.error("Error processing data or updating chart:", e);
        }
    };

    source.onerror = function(error) {
        console.error("EventSource failed:", error);
        // Attempt to reconnect if the connection closes unexpectedly
        source.close();
        //reconnection messagge
    };
    
</script>
<footer>
    <br>
    <center>
    <p>This page is developed by Smartopia &copy</p>
    </center>
</footer>
</body>
</html>
