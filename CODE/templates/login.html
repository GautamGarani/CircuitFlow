<!DOCTYPE html>
<html>
<head>
    <title>CircuitFlow: Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../static/circuitflow_logo.png">
<style>
    /* * General Theme Styles */
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5; /* Light Gray Background */
    }

    .header{
        position: sticky;
        display: grid;
        place-items: center;
        text-align: center;
        top: 0;
        padding: 12px 16px; /* Adjusted padding unit */
        background: #12a1de; /* CircuitFlow Blue */
        color: #f5f5f5; /* Light Text */
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        /* Shimmer animation inherited from the theme */

    }

    .header-content {
        display: flex;
        align-items: center;
        gap: 10px;
        mask: linear-gradient(-60deg, #000 30%, #0005, #000 70%) right/350% 100%;
        animation: shimmer 2.5s infinite;
    }

    .logo {
        height: 70px; /* Reduced slightly from 90px to fit better with login title */
        width: auto;
    }

    .mainContent{
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 40px;
        min-height: 100vh;
        margin-bottom: 0px;
    }

    /* * Form Container Styles */
    form{
        background: white;
        padding: 30px 35px; /* Slightly increased padding */
        border-radius: 8px; 
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); /* Softer shadow */
        width: 300px;
        transition: transform 0.3s ease-in-out;
    }

    form:hover {
        transform: translateY(-5px); /* Lift effect on hover */
    }

    form h2{
        margin-top: 0;
        margin-bottom: 25px;
        text-align: center;
        color: #12a1de;
    }

    /* * Input Styles */
    input[type=text], input[type=password]{
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 16px;
        box-sizing: border-box; /* Include padding in the element's total width and height */
        transition: border-color 0.3s;
    }

    input[type=text]:focus, input[type=password]:focus {
        border-color: #12a1de; /* Highlight border on focus */
        outline: none;
        box-shadow: 0 0 5px rgba(18, 161, 222, 0.5);
    }

    /* * Primary Button Styles (Login) */
    .login-button{
        margin-top: 15px;
        width: 100%;
        padding: 12px;
        background: #12a1de; /* CircuitFlow Blue */
        color: white;
        border-radius: 5px;
        border: none;
        font-size: 18px;
        cursor: pointer;
        font-weight: bold;
        display: inline-block;
        transition: background 0.3s, transform 0.3s;
        
        /* Shimmer Animation Setup (as defined in original theme) */
        mask: linear-gradient(-60deg, #000 30%, #0005, #000 70%) right/350% 100%;
        animation: shimmer 2.5s infinite;
    }

    .login-button:hover{
        background: #0e84b7; /* Slightly darker blue on hover */
        transform: scale(1.02);
        animation: none; /* Pause shimmer on hover for a cleaner look */
    }

    /* * Secondary Button Styles (Register/Contact) */
    .register-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
    }

    .register-link a {
        color: #12a1de;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.3s;
    }

    .register-link a:hover {
        color: #0e84b7;
        text-decoration: underline;
    }

    /* * Keyframe Animations */
    @keyframes shimmer{
        100%{
            mask-position: left;
        }
    }
    
    /* Footer styles */
    footer{
        margin-top: 20px; 
        padding: 10px;
        font-size: 14px;
        opacity: 0.7;
        text-align: center;
    }
</style>
</head>
<body>
<div class="header" id="myheader">
    <div class="header-content">
        <img src="../static/circuitflow_logo.png" class="logo" alt="CircuitFlow Logo">
        <h2>CircuitFlow</h2>
    </div>
</div>

<div class="mainContent">
    <form autocomplete="off" action="/login" method="POST">
        <h2>Login</h2>
        
        <input type="text" name="username" placeholder="Username" required title="Enter your username">
        
        <input type="password" name="password" placeholder="Password" required title="Enter your password">
        
        <button type="submit" class="login-button">
            Login &#8594;
        </button>

    </form>
</div>

<footer>
    <p>This page is developed by Smartopia &copy</p>
</footer>
</body>
</html>
