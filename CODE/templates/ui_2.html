<!DOCTYPE html>
<html>
<head>
    <title>CircuitFlow: Monitor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="TimeMaster.png">
<style>
        body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;    
    }
    .header{
        position: sticky;
        display: grid;
        place-items: center;
        text-align: center;
        top: 0;
        padding: 12 16;
        background: #12a1de;
        color: black;
        font: 18 Arial, sans-serif;
        font-weight: bold;
        box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        color: #f5f5f5;
        z-index: 1000;
    }


    .mainContent{
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 40px;
        min-height: 100vh;
        margin-bottom: 0px;
    }

    form{
        background: white;
        padding: 25px 30px;
        border-radius: 8px; 
        border-color: black;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        width: 300px;
    }

    form h2{
        margin-top: 0;
        text-align: center;
    }

    input[type=text], input[type=number], input[type=file]{
        width: 100%;
        padding: 3px;
        margin-top: 10px;
        border-radius: 7px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    button{
        margin-top: 15px;
        width: 100%;
        padding: 12px;
        background: #12a1de;
        color: white;
        border-radius: 5px;
        border: none;
        font-size: 16px;
        cursor: pointer;
        font-weight: 80px;
        display: inline-block;
        mask: linear-gradient(-60deg, #000 30%, #0005, #000 70%) right/350% 100%;
        animation: shimmer 2.5s infinite;
    
    }

    @keyframes shimmer{
        100%{
            mask-position: left;
        }
    }

    footer{
       display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 18px;
    }
    .span1{
        color: red;
        font-weight: bold;
    }
    p{
        font-size: 18px;
    }


    @keyframes button-hover {
        0% {
        color:#3399ff;
        background-color:white;
     }

    50% {
        color: white;
        background-color: black;
        border-color: black;
    }
    100% {
        color:#3399ff;
        background-color:white;
     }
}

</style>
</head>
<body>
<div class="header" id="myheader">
    <h2>CircuitFlow</h2>
</div>
<div class="mainContent">
<center>

<div class="mainContent">
    <h2>Dashboard</h2>
<a href="/monthly-result">
    <button>View Monthly Analysis &rarr;</button>
</a>
<br>
<h2>&#10024; Today's Cumulated Data</h2>
<a href="/daily-result">
    <button>View Daily Report &rarr;</button>
</a>
<br>
<h2>&#128187; Live Data Analysis</h2>
<a href="/live" target="_blank">
    <button>Live data &rarr;</button>
</a>
</div>
</center> 
<footer>
    <p>This page is developed by Smartopia &copy</p>
</footer>
</body>
</html>
