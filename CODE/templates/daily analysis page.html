<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CircuitFlow – Daily Report</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #cce7ff, #e8f6ff);
        font-family: Arial, sans-serif;
    }

    .header {
        background: #0a75c2;
        padding: 18px;
        text-align: center;
        color: white;
        font-size: 24px;
        font-weight: bold;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Grid: Left small block + Right large block */
    .main-grid {
        display: grid;
        grid-template-columns: 260px auto;
        gap: 20px;
        width: 90%;
        margin: 20px auto;
        height: calc(100vh - 120px);
    }

    .left-col {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .block-small {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.15);
        height: 100%;
        text-align: center;
    }

    .block-small h3,
    .block-large h3 {
        color: #0a75c2;
        margin-bottom: 10px;
        font-size: 18px;
        text-align: center;
    }

    /* Calendar styling */
    input[type="date"] {
        padding: 10px;
        width: 90%;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    /* Large block for graph */
    .block-large {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.18);
        height: 100%;
    }

    canvas {
        width: 100% !important;
        height: 90% !important;
    }

    .back-btn {
        display: inline-block;
        padding: 10px 20px;
        background: #0a75c2;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-size: 15px;
        transition: 0.3s;
        margin-top: 400px;
    }

    .back-btn:hover {
        background: #004e8a;
    }
</style>
</head>

<body>

<div class="header">CircuitFlow – Daily Report</div>

<div class="main-grid">

    <!-- LEFT COLUMN: Calendar -->
    <div class="left-col">
        <div class="block-small">
            <h3>📅 Pick a Date</h3>
            <input type="date" id="calendarPick">
            <p style="margin-top:15px; font-size:16px;">
                Select a day to view its detailed water usage.
            </p>
            <a href="mainpage.html" class="back-btn">⬅ Back</a>
        </div>
    </div>

    <!-- RIGHT COLUMN: Weekly Usage -->
    <div class="block-large">
        <h3>📊 Weekly Water Usage</h3>
        <canvas id="weeklyChart"></canvas>
    </div>
</div>

<script>
    // Dummy weekly values 
    const weeklyData = [12, 20, 18, 25, 22, 15, 30];

    const ctx = document.getElementById('weeklyChart').getContext('2d');
    const weeklyChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
            datasets: [{
                label: "Litres Used",
                data: weeklyData,
                backgroundColor: "rgba(10,117,194,0.3)",
                borderColor: "#0a75c2",
                borderWidth: 2,
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>

</body>
</html>
