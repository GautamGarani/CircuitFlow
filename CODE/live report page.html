<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CircuitFlow – Live Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #cce7ff, #e8f6ff);
        font-family: Arial, sans-serif;
    }

    .header {
        background: #0a75c2;
        padding: 18px;
        text-align: center;
        color: white;
        font-size: 24px;
        font-weight: bold;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* 2-column layout */
    .main-grid {
        display: grid;
        grid-template-columns: 260px auto;
        gap: 20px;
        width: 90%;
        margin: 20px auto;
        height: calc(100vh - 120px);
    }

    /* Left column (two blocks) */
    .left-col {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .block-small {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.15);
        height: 48%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        transition: 0.3s;
    }

    .block-small:hover {
        transform: scale(1.02);
    }

    /* Graph block */
    .block-large {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.18);
        height: 100%;
    }

    .block-small h3, .block-large h3 {
        color: #0a75c2;
        margin-bottom: 10px;
        text-align: center;
        font-size: 18px;
    }

    .back-btn-box {
        padding: 12px;
        background: #0a75c2;
        color: white;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
        text-decoration: none;
        display: inline-block;
    }

    .back-btn-box:hover {
        background: #004e8a;
    }

    canvas {
        width: 100% !important;
        height: 95% !important;
    }

</style>
</head>

<body>

<div class="header">CircuitFlow – Live Monitoring</div>

<div class="main-grid">

    <!-- LEFT COLUMN -->
    <div class="left-col">

        <!-- Block 1: LIVE USAGE -->
        <div class="block-small">
            <h3>🔵 Live Usage</h3>
            <p id="usageValue">Flow Rate: 0.0 L/min</p>
            <p id="totalValue">Total Used: 0.0 L</p>
            <p id="valveStatus">Valve: CLOSED</p>
        </div>

        <!-- Block 2: BACK BUTTON BLOCK -->
        <div class="block-small">
            <h3>⬅ Back to Main Page</h3>
            <a href="mainpage.html" class="back-btn-box">Go Back</a>
        </div>

    </div>

    <!-- RIGHT COLUMN (GRAPH) -->
    <div class="block-large">
        <h3>📈 Live Flow Graph</h3>
        <canvas id="flowChart"></canvas>
    </div>

</div>

<script>
    // Chart.js live graph
    const ctx = document.getElementById('flowChart').getContext('2d');
    const flowChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: "Flow (L/min)",
                data: [],
                borderColor: "#0a75c2",
                backgroundColor: "rgba(10,117,194,0.2)",
                borderWidth: 2,
                tension: 0.35,
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { beginAtZero: true }
            }
        }
    });

    // Dummy live data
    let t = 0;
    setInterval(() => {
        let flow = (Math.random() * 8).toFixed(2);

        document.getElementById("usageValue").textContent = "Flow Rate: " + flow + " L/min";
        document.getElementById("totalValue").textContent =
            "Total Used: " + (parseFloat(document.getElementById("totalValue").textContent.split(" ")[2]) + flow/10).toFixed(2) + " L";

        document.getElementById("valveStatus").textContent = flow > 1 ? "Valve: OPEN" : "Valve: CLOSED";

        flowChart.data.labels.push(t++);
        flowChart.data.datasets[0].data.push(flow);
        flowChart.update();

    }, 1000);
</script>

</body>
</html>
